<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background:url('cover.png') center center/cover no-repeat;
}

.hotspot{
position:absolute;
display:block;
text-decoration:none;
}

.candle{
position:absolute;
top:39%;
left:50%;
transform:translateX(-50%);
width:120px;
height:150px;
cursor:pointer;
}

.flame{
width:30px;
height:30px;
background:#ffd65c;
border-radius:50%;
margin:auto;
box-shadow:0 0 25px #ffd65c;
animation:flicker 1s infinite;
}

@keyframes flicker{
0%{transform:scale(1);}
50%{transform:scale(1.12);}
100%{transform:scale(1);}
}

#wish{
position:absolute;
top:63%;
width:100%;
text-align:center;
font-size:34px;
color:white;
opacity:0;
transition:1s;
font-family:"Brush Script MT","Apple Chancery","Snell Roundhand",cursive;
font-style:italic;
letter-spacing:1px;
text-shadow:0 2px 8px rgba(0,0,0,0.45);
}

.mountain{
left:5%;
bottom:12%;
width:28%;
height:18%;
}

.wave{
left:36%;
bottom:12%;
width:28%;
height:18%;
}

.surf{
right:5%;
bottom:12%;
width:28%;
height:18%;
}
</style>
</head>

<body>

<div class="candle" onclick="blowCandle()">
<div class="flame" id="flame"></div>
</div>

<div id="wish">wish fulfilled ✨</div>

<a class="hotspot mountain" href="https://www.instagram.com/reel/DWqtMLfAIy0/?igsh=NWs3ZmU4OG5rbGdn"></a>

<a class="hotspot wave" href="https://www.google.com/search?q=生命靈數流年4課題"></a>

<a class="hotspot surf" href="message.html"></a>

<script>
function blowCandle(){
document.getElementById("flame").style.display="none";
document.getElementById("wish").style.opacity="1";
}
</script>

</body>
</html>
