<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
background:url('cover.png') center center/cover no-repeat;
height:100vh;
font-family:sans-serif;
}

.overlay{
width:100%;
height:100vh;
position:relative;
}

.candle{
position:absolute;
top:42%;
left:50%;
transform:translateX(-50%);
width:120px;
height:140px;
cursor:pointer;
}

.flame{
width:28px;
height:28px;
background:#ffd65c;
border-radius:50%;
margin:auto;
box-shadow:0 0 25px #ffd65c;
animation:flicker 1s infinite;
}

@keyframes flicker{
0%{transform:scale(1);}
50%{transform:scale(1.12);}
100%{transform:scale(1);}
}

#wish{
position:absolute;
top:63%;
width:100%;
text-align:center;
font-size:30px;
color:white;
opacity:0;
transition:1s;
font-family:cursive;
}

#typing{
position:absolute;
top:71%;
width:100%;
text-align:center;
font-size:34px;
color:white;
font-family:cursive;
}

.icons{
position:absolute;
bottom:7%;
width:100%;
display:flex;
justify-content:center;
gap:50px;
font-size:56px;
}

.icons a{
text-decoration:none;
}

</style>
</head>

<body>

<div class="overlay">

<div class="candle" onclick="blowCandle()">
<div class="flame" id="flame"></div>
</div>

<div id="wish">
wish fulfilled ✨
</div>

<div id="typing"></div>

<div class="icons">

<a href="https://www.instagram.com/reel/DWqtMLfAIy0/?igsh=NWs3ZmU4OG5rbGdn">
⛰️
</a>

<a href="https://www.google.com/search?q=生命靈數流年4課題">
🌊
</a>

<a href="message.html">
🏄‍♀️
</a>

</div>

</div>

<script>

function blowCandle(){

document.getElementById("flame").style.display="none";

document.getElementById("wish").style.opacity="1";

typeText(
"TODAY IS YOUR DAY…",
"typing",
90
);

}

function typeText(text,id,speed){

let i=0;

const target=document.getElementById(id);

target.innerHTML="";

function typing(){

if(i<text.length){

target.innerHTML += text.charAt(i);

i++;

setTimeout(typing,speed);

}

}

typing();

}

</script>

</body>
</html>
