<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:'Gaegu', cursive;
    background:
    linear-gradient(to bottom,#0d1b3d 0%,#27496d 45%,#4fb0c6 70%,#8ed6e8 100%);
    height:100vh;
    color:white;
}

.stars{
    position:absolute;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size:50px 50px;
    opacity:0.6;
}

.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
}

h1{
    font-size:68px;
    margin:0;
    font-family:'Patrick Hand', cursive;
    letter-spacing:2px;
}

.subtitle{
    margin-top:10px;
    font-size:28px;
    letter-spacing:3px;
}

.cake{
    margin-top:40px;
}

.candle{
    width:14px;
    height:90px;
    background:#fff8dc;
    border-radius:10px;
    position:relative;
    margin:auto;
}

.flame{
    width:24px;
    height:24px;
    background:#ffcb42;
    border-radius:50%;
    position:absolute;
    top:-24px;
    left:-5px;
    box-shadow:0 0 20px #ffd56b;
    animation:flicker 1s infinite;
}

@keyframes flicker{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

button{
    margin-top:28px;
    border:none;
    background:#ffffffcc;
    color:#255070;
    padding:12px 28px;
    border-radius:999px;
    font-size:22px;
    font-family:'Gaegu', cursive;
}

#wish{
    opacity:0;
    margin-top:25px;
    font-size:34px;
    transition:1s;
}

.typewriter{
    margin-top:40px;
    min-height:60px;
    font-size:30px;
    letter-spacing:2px;
}

.icons{
    margin-top:50px;
    display:flex;
    gap:40px;
    font-size:52px;
}

.icons a{
    text-decoration:none;
    transition:0.3s;
}

.icons a:hover{
    transform:translateY(-6px) scale(1.08);
}

.wave{
    position:absolute;
    bottom:0;
    width:100%;
    height:160px;
    background:#4fb0c6;
    border-radius:100% 100% 0 0;
}

.mountain{
    position:absolute;
    bottom:100px;
    width:0;
    height:0;
    border-left:140px solid transparent;
    border-right:140px solid transparent;
    border-bottom:220px solid #2d5d4f;
    left:8%;
    opacity:0.85;
}

.mountain2{
    position:absolute;
    bottom:120px;
    width:0;
    height:0;
    border-left:180px solid transparent;
    border-right:180px solid transparent;
    border-bottom:260px solid #3f7a66;
    right:5%;
    opacity:0.8;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="mountain"></div>
<div class="mountain2"></div>

<div class="wave"></div>

<div class="container">

<h1>Happy Birthday</h1>

<div class="subtitle">MAKE A WISH</div>

<div class="cake">
<div class="candle">
<div class="flame" id="flame"></div>
</div>
</div>

<button onclick="blowCandle()">
blow the candle
</button>

<div id="wish">wish fulfilled ✨</div>

<div class="typewriter" id="typing"></div>

<div class="icons">

<a href="https://www.instagram.com/reel/DWqtMLfAIy0/?igsh=NWs3ZmU4OG5rbGdn" target="_blank">
⛰️
</a>

<a href="https://www.google.com/search?q=生命靈數流年4課題" target="_blank">
🌊
</a>

<a href="message.html">
🏄‍♀️
</a>

</div>

</div>

<script>

function blowCandle(){

document.getElementById("flame").style.display="none";

document.getElementById("wish").style.opacity="1";

typeText(
"TODAY IS YOUR DAY…",
"typing",
90
);

}

function typeText(text,id,speed){

let i=0;

const target=document.getElementById(id);

function typing(){

if(i<text.length){

target.innerHTML += text.charAt(i);

i++;

setTimeout(typing,speed);

}

}

typing();

}

</script>

</body>
</html>
