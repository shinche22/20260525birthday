<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#fff7f8;
    overflow-x:hidden;
    font-family:'Cormorant Garamond', serif;
    color:#5a4a4a;
    text-align:center;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px 20px 80px;
    box-sizing:border-box;
}

h1{
    font-size:64px;
    margin-bottom:10px;
    font-family:'Great Vibes', cursive;
    font-weight:400;
}

.subtitle{
    font-size:20px;
    letter-spacing:3px;
    margin-bottom:50px;
}

.cake{
    position:relative;
    margin:40px 0;
}

.candle{
    width:14px;
    height:90px;
    background:#fff;
    border-radius:10px;
    position:relative;
    margin:auto;
}

.flame{
    width:24px;
    height:24px;
    background:orange;
    border-radius:50%;
    position:absolute;
    top:-25px;
    left:-5px;
    box-shadow:0 0 20px orange;
    animation:flicker 1s infinite;
}

@keyframes flicker{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

button{
    border:none;
    background:#e7c7cb;
    color:#fff;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    font-size:16px;
    letter-spacing:1px;
    margin-top:20px;
    transition:0.3s;
    font-family:'Cormorant Garamond', serif;
}

button:hover{
    transform:scale(1.05);
}

#wish{
    margin-top:30px;
    font-size:28px;
    letter-spacing:3px;
    opacity:0;
    transition:1s;
}

.typewriter{
    margin-top:60px;
    width:90%;
    max-width:700px;
    min-height:60px;
    font-size:24px;
    letter-spacing:2px;
    line-height:1.8;
}

.icons{
    margin-top:60px;
    display:flex;
    gap:30px;
    font-size:38px;
}

.icons a{
    text-decoration:none;
    transition:0.3s;
}

.icons a:hover{
    transform:translateY(-5px);
}

#continueBtn{
    display:none;
}

#message{
    margin-top:40px;
    max-width:800px;
    line-height:2;
    font-size:22px;
    white-space:pre-line;
    padding:0 10px 120px;
    box-sizing:border-box;
}

.fade{
    animation:fadeIn 1.5s forwards;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday</h1>

<div class="subtitle">MAKE A WISH</div>

<div class="cake">
    <div class="candle">
        <div class="flame" id="flame"></div>
    </div>
</div>

<button onclick="blowCandle()">blow the candle</button>

<div id="wish">wish fulfilled ✨</div>

<div class="typewriter" id="typing1"></div>

<div class="icons">
    <a href="https://www.instagram.com/reel/DWqtMLfAIy0/?igsh=NWs3ZmU4OG5rbGdn" target="_blank">💗</a>

    <a href="https://www.google.com/search?q=生命靈數流年4課題" target="_blank">🎀</a>

    <a href="#messageSection">🍒</a>
</div>

<div class="typewriter" id="typing2"></div>

<button id="continueBtn" onclick="showMessage()">
click to continue
</button>

<div id="messageSection"></div>

<div id="message"></div>

</div>

<script>

function blowCandle(){

    document.getElementById("flame").style.display="none";

    const wish=document.getElementById("wish");

    wish.style.opacity="1";

    typeText(
        "TODAY IS YOUR DAY…",
        "typing1",
        90,
        () => {
            setTimeout(() => {
                typeText(
                    "WHAT I WANT TO SAY IS…",
                    "typing2",
                    90,
                    () => {
                        document.getElementById("continueBtn").style.display="inline-block";
                    }
                )
            },800)
        }
    );
}

function typeText(text,id,speed,callback){

    let i=0;

    const target=document.getElementById(id);

    target.innerHTML="";

    function typing(){

        if(i<text.length){

            target.innerHTML += text.charAt(i);

            i++;

            setTimeout(typing,speed);

        }else{
            if(callback) callback();
        }
    }

    typing();
}

function showMessage(){

document.getElementById("message").classList.add("fade");

document.getElementById("message").innerText = `

我對於我今年的卡片真的太滿意了！！我之前一直很懶得研究ai，現在覺得一定要跟上ai浪潮欸XD

但或許你每天在台東看天看海的人生遠離這些還是可以過的很快樂！我今年頻繁的因為工作壓力大出國玩，但後來發現其實人生追求的不過是安穩的生活即可！能在台東每天被山海包圍，想必幸福到不行！你真的是好早就領悟到要如何鬆散又幸福的生活，容我叫你一聲大師！！

37歲了我們離不惑之年也越來越近了，但希望我們也還是能繼續享受最後幾年一些有惑的過程，有時候過程也是必要的，解惑之後回想起來也會更有趣，下次有上台北再相約喔！！生日快樂！！一切平安健康！啾啾

`;

document.getElementById("message")
.scrollIntoView({behavior:"smooth"});

}

</script>

</body>
</html>
